[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short -q
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::ResourceWarning
norecursedirs =
    .venv
    venv
    node_modules
    __pycache__
    .git
    dist
    build
    .tmp
    test_tmp
markers =
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (may need Ollama, DB)
    slow: Tests that take >5 seconds
    smoke: Quick smoke tests for CI
