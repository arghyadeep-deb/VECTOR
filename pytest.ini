[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short -q
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::ResourceWarning
norecursedirs =
    .venv
    venv
    node_modules
    __pycache__
    .git
    dist
    build
    .tmp
    test_tmp
