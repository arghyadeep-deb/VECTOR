[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short -q
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::ResourceWarning
norecursedirs =
    .venv
    venv
    node_modules
    __pycache__
    .git
    dist
    build
    .tmp
    test_tmp
markers =
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (may need Ollama, DB)
    slow: Tests that take >5 seconds
    smoke: Quick smoke tests for CI
    requires_ollama: Makes real calls to the local Ollama daemon (cold model swaps are slow; 300s timeout)
    live: Real dispatch against a live absorbed-capability (network/credential-gated, skips when unavailable)
