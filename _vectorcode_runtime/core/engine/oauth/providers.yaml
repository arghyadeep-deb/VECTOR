  category: dev_tools
  auth_mode: api_key
  api_base: https://api.datadoghq.com/api/v1
  key_env: DD_API_KEY

pagerduty:
  name: "PagerDuty"
  category: dev_tools
  auth_mode: oauth2
  auth_url: https://app.pagerduty.com/oauth/authorize
  token_url: https://app.pagerduty.com/oauth/token
  scopes: [read, write]
  user_info_url: https://api.pagerduty.com/users/me

launchdarkly:
