# VECTOR OAuth Provider Registry — 80+ providers
# Inspired by nango's providers.yaml structure (logic reimplemented in Python from public OAuth docs)
# auth_mode: oauth2 | oauth1 | api_key | basic
# Categories: dev_tools | productivity | communication | social | finance | crm | storage | ai | ecommerce | other

# ── Dev Tools ──────────────────────────────────────────────────────────────────

github:
  name: "GitHub"
  category: dev_tools
  auth_mode: oauth2
  auth_url: https://github.com/login/oauth/authorize
  token_url: https://github.com/login/oauth/access_token
  scopes: [repo, read:user, user:email, notifications]
  user_info_url: https://api.github.com/user

gitlab:
  name: "GitLab"
  category: dev_tools
  auth_mode: oauth2
  auth_url: https://gitlab.com/oauth/authorize
  token_url: https://gitlab.com/oauth/token
  scopes: [read_user, read_api, read_repository, write_repository]
  user_info_url: https://gitlab.com/api/v4/user
  extra_params: {response_type: code}

bitbucket:
  name: "Bitbucket"
  category: dev_tools
  auth_mode: oauth2
  auth_url: https://bitbucket.org/site/oauth2/authorize
  token_url: https://bitbucket.org/site/oauth2/access_token
  scopes: [account, repository, pullrequest, issue]
  user_info_url: https://api.bitbucket.org/2.0/user

vercel:
