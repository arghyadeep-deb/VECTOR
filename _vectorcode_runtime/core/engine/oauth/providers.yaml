  category: dev_tools
  auth_mode: oauth2
  auth_url: https://vercel.com/oauth/authorize
  token_url: https://api.vercel.com/v2/oauth/access_token
  scopes: []

netlify:
  name: "Netlify"
  category: dev_tools
  auth_mode: oauth2
  auth_url: https://app.netlify.com/authorize
  token_url: https://api.netlify.com/oauth/token
  scopes: []

digitalocean:
  name: "DigitalOcean"
  category: dev_tools
  auth_mode: oauth2
  auth_url: https://cloud.digitalocean.com/v1/oauth/authorize
  token_url: https://cloud.digitalocean.com/v1/oauth/token
  scopes: [read, write]
  user_info_url: https://api.digitalocean.com/v2/account

heroku:
  name: "Heroku"
