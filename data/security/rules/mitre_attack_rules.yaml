# MITRE ATT&CK Starter Detection Rules
# Reference: https://attack.mitre.org/
# Each rule maps to one or more ATT&CK technique IDs.

rules:

  # ---- Execution -------------------------------------------------------

  - id: "T1059_cmd_scripting"
    name: "Command and Scripting Interpreter Detected"
    description: "Detects execution of shell interpreters (bash/cmd/powershell) via log patterns."
    source: "log_aggregator"
    enabled: true
    condition:
      type: "pattern"
      field: "message"
      pattern: "(?i)(cmd\\.exe|powershell|/bin/bash|/bin/sh|subprocess\\.run|os\\.system|shell=True)"
    severity: 7
    response:
      - "alert"
      - "log_evidence"
    tags: ["execution", "T1059", "TA0002"]

  - id: "T1086_powershell"
    name: "PowerShell Execution"
    description: "PowerShell invocation detected — common in living-off-the-land attacks."
    source: "log_aggregator"
    enabled: true
    condition:
      type: "pattern"
      field: "message"
      pattern: "(?i)(powershell|pwsh|Invoke-Expression|IEX|EncodedCommand|-enc |-nop )"
    severity: 8
    response:
      - "alert"
      - "notify"
    tags: ["execution", "T1086", "T1059.001", "TA0002"]

  # ---- Discovery -------------------------------------------------------

  - id: "T1046_port_scan"
    name: "Network Service Discovery / Port Scan"
    description: "High rate of connection attempts suggests port scanning (T1046)."
    source: "network_monitor"
    enabled: true
    condition:
      type: "rate"
      field: "message"
      pattern: "(?i)(connection|connect|port|scan)"
      threshold: 15
      window: 60
    severity: 7
    response:
      - "alert"
      - "playbook:port_scan"
    tags: ["discovery", "T1046", "TA0007"]

  - id: "T1018_remote_system_discovery"
    name: "Remote System Discovery"
    description: "Patterns consistent with scanning for other hosts on the network."
    source: "log_aggregator"
    enabled: true
    condition:
      type: "pattern"
      field: "message"
      pattern: "(?i)(nmap|masscan|netstat -an|arp -a|ping sweep|host discovery)"
    severity: 6
    response:
      - "alert"
    tags: ["discovery", "T1018", "TA0007"]

  # ---- Credential Access -----------------------------------------------

  - id: "T1110_brute_force"
    name: "Brute Force Login Attempts"
    description: "High rate of authentication failures — possible brute force (T1110)."
    source: "log_aggregator"
    enabled: true
    condition:
      type: "rate"
      field: "message"
      pattern: "(?i)(auth.*fail|login.*fail|invalid.*password|incorrect.*password|authentication.*error)"
      threshold: 5
      window: 60
    severity: 8
    response:
      - "alert"
      - "notify"
      - "playbook:brute_force"
    tags: ["credential_access", "T1110", "TA0006"]

  - id: "T1078_valid_accounts"
    name: "Suspicious Account Usage"
    description: "Access from unusual context — possible compromised valid account (T1078)."
    source: "log_aggregator"
    enabled: true
    condition:
      type: "pattern"
      field: "message"
      pattern: "(?i)(sudo|runas|privilege.*escalat|become.*root|su -|admin.*login)"
    severity: 6
    response:
      - "alert"
    tags: ["credential_access", "T1078", "TA0006"]

  # ---- Defense Evasion -------------------------------------------------

  - id: "T1070_log_clearing"
    name: "Log File Clearing Detected"
    description: "Attempt to clear logs — classic defense evasion tactic (T1070)."
    source: "log_aggregator"
    enabled: true
    condition:
      type: "pattern"
      field: "message"
      pattern: "(?i)(clear.*log|delete.*log|truncate.*log|rm.*\\.log|wevtutil.*cl|Clear-EventLog)"
    severity: 9
    response:
      - "alert"
      - "notify"
      - "log_evidence"
    tags: ["defense_evasion", "T1070", "TA0005"]

  # ---- Impact ----------------------------------------------------------

  - id: "T1485_data_destruction"
    name: "Data Destruction Attempt"
    description: "Detects commands that could cause irreversible data loss (T1485)."
    source: "log_aggregator"
    enabled: true
    condition:
      type: "pattern"
      field: "message"
      pattern: "(?i)(rm -rf|shred|DROP TABLE|TRUNCATE|format.*drive|wipe.*disk|del /f /s)"
    severity: 10
    response:
      - "alert"
      - "notify"
      - "playbook:data_destruction"
    tags: ["impact", "T1485", "TA0040"]

  - id: "T1496_resource_hijacking"
    name: "Resource Hijacking (High CPU)"
    description: "Sustained high CPU may indicate cryptomining or resource abuse (T1496)."
    source: "system_monitor"
    enabled: true
    condition:
      type: "threshold"
      field: "cpu_percent"
      operator: ">"
      value: 95.0
    severity: 6
    response:
      - "alert"
      - "playbook:high_resource_usage"
    tags: ["impact", "T1496", "TA0040"]

  # ---- Lateral Movement ------------------------------------------------

  - id: "T1021_remote_services"
    name: "Unusual Remote Service Access"
    description: "SSH/RDP/WinRM access from unexpected sources (T1021)."
    source: "log_aggregator"
    enabled: true
    condition:
      type: "pattern"
      field: "message"
      pattern: "(?i)(ssh.*from|rdp.*session|winrm.*connect|psexec|wmic.*remote)"
    severity: 7
    response:
      - "alert"
    tags: ["lateral_movement", "T1021", "TA0008"]

  # ---- Injection -------------------------------------------------------

  - id: "T1055_process_injection"
    name: "Process Injection Attempt"
    description: "Patterns suggesting code injection into another process (T1055)."
    source: "log_aggregator"
    enabled: true
    condition:
      type: "pattern"
      field: "message"
      pattern: "(?i)(inject|WriteProcessMemory|VirtualAllocEx|CreateRemoteThread|ptrace|LD_PRELOAD)"
    severity: 9
    response:
      - "alert"
      - "notify"
    tags: ["privilege_escalation", "T1055", "TA0004"]
