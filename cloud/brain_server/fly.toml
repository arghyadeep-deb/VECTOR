app = "vector-brain"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[env]
  PORT = "8000"
  VECTOR_ENV = "production"
  VECTOR_DEBUG = "false"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
