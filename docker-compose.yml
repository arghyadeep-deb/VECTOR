version: "3.9"

networks:
  vector_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  vectorcode:
    build: .
    ports:
      - "8123:8123"
    environment:
      - VECTOR_HOME=/home/vector/.vectorcode
      - OLLAMA_BASE_URL=http://ollama:11434
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - vectorcode_data:/home/vector/.vectorcode
      - ./core:/workspace/core:ro
      - ./data:/workspace/data:rw
      - ./models:/workspace/models:ro
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vector_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - vector_net
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          memory: 4G
      # Uncomment to enable GPU passthrough on supported hosts:
      # reservations:
      #   devices:
      #     - driver: nvidia
      #       count: 1
      #       capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vectorcode_data:
  ollama_data:
