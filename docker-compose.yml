version: "3.9"

services:
  vectorcode:
    build: .
    ports:
      - "8123:8123"
    environment:
      - VECTOR_HOME=/home/vector/.vectorcode
      - OLLAMA_BASE_URL=http://ollama:11434
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - vectorcode_data:/home/vector/.vectorcode
      - .:/workspace:ro
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  vectorcode_data:
  ollama_data:
