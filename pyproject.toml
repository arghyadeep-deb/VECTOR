[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vectorcode"
version = "0.1.0"
description = "Autonomous coding agent — Hermes + Ruflo absorbed into Python"
readme = "vectorcode/README.md"
authors = [{ name = "Arghyadeep Deb", email = "arghyadeep@kiit.ac.in" }]
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "websockets>=12.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
ollama = ["ollama>=0.3.0"]
voice = ["sounddevice", "soundfile"]
vision = ["pillow"]
all = ["vectorcode[dev,ollama,voice,vision]"]

[project.scripts]
vector = "vectorcode.cli:main"
vectorcode = "vectorcode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vectorcode/python/vectorcode"]

[tool.hatch.build.targets.sdist]
include = [
    "vectorcode/python/vectorcode/**",
    "vectorcode/skills/**",
    "vectorcode/README.md",
    "pyproject.toml",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["vectorcode/python/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
ignore = ["E501", "F401", "F811", "E402"]
