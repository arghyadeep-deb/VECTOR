[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vectorcode"
version = "0.1.0"
description = "Autonomous coding agent — multi-provider, multi-platform, production-grade"
readme = "vectorcode/README.md"
authors = [{ name = "Arghyadeep Deb", email = "arghyadeepdeb020703@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries",
]

# Core runtime dependencies
dependencies = [
    # HTTP / async
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",
    "websockets>=12.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",

    # Data / config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "PyYAML>=6.0",
    "tomli>=2.0; python_version<'3.11'",
    "tomli-w>=1.0.0",
    "python-dotenv>=1.0.0",

    # CLI / display
    "rich>=13.0.0",
    "typer>=0.9.0",
    "loguru>=0.7.2",
    "click>=8.0.0",

    # Storage
    "aiosqlite>=0.20.0",

    # Provider SDKs (core)
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.0",
    "ollama>=0.3.0",
    "boto3>=1.34.0",  # bedrock

    # MCP
    "mcp>=1.0.0",
    "jsonschema>=4.0.0",

    # Web tools
    "firecrawl-py>=1.0.0",
    "duckduckgo-search>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.2.26",

    # Memory / vectors
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",

    # Auth (OAuth flows)
    "requests-oauthlib>=2.0.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
# Voice (optional — heavy)
voice = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "openai-whisper>=20240930",
]

# Vision (optional)
vision = [
    "pillow>=10.0.0",
    "opencv-python-headless>=4.10.0",
]

# Browser (optional — heavy)
browser = [
    "playwright>=1.45.0",
]

# Image generation (optional)
imagegen = [
    "fal-client>=0.4.0",
    "replicate>=0.32.0",
]

# Communications (optional bots)
comms = [
    "discord.py>=2.4.0",
    "slack-sdk>=3.30.0",
    "python-telegram-bot>=21.0",
]

# Code analysis (optional)
codeanalysis = [
    "tree-sitter>=0.23.0",
    "tree-sitter-languages>=1.10.0",
]

# Dev / test
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
]

# All-in-one
all = [
    "vectorcode[voice,vision,browser,imagegen,comms,codeanalysis,dev]",
]

[project.scripts]
vector = "vectorcode.cli:main"
vectorcode = "vectorcode.cli:main"

[project.urls]
Documentation = "https://github.com/Arghyadeep-Deb/vectorcode"
Source = "https://github.com/Arghyadeep-Deb/vectorcode"
Issues = "https://github.com/Arghyadeep-Deb/vectorcode/issues"

[tool.hatch.build.targets.wheel]
packages = ["vectorcode/python/vectorcode"]

[tool.hatch.build.targets.sdist]
include = [
    "vectorcode/python/vectorcode/**",
    "vectorcode/skills/**",
    "vectorcode/docs/**",
    "vectorcode/README.md",
    "pyproject.toml",
    "LICENSE",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/.pytest_cache",
    "**/test_*.py",
    "vectorcode/packages/**",  # TS scaffolding archived
]

[tool.pytest.ini_options]
testpaths = ["vectorcode/python/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "slow: slow tests (deselect with -m 'not slow')",
    "integration: requires real network/services",
    "requires_ollama: needs local Ollama running",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", "vectorcode/packages", "vectorcode/docs/absorption"]

[tool.ruff.lint]
ignore = ["E501", "E402", "F401", "F811"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
