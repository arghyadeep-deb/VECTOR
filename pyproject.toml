[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vector"
version = "1.0.0"
description = "V.E.C.T.O.R. — Virtual Entity for Cognitive Tasks & Operational Reasoning"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["core*", "agents*", "integrations*"]
