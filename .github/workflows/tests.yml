name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  pytest-shards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - root-00-04
          - root-05-09
          - root-10-14
          - root-15-19
          - root-20-29
          - root-30-39
          - root-40-49
          - root-50-59
          - root-60-69
          - root-70-end
          - backend-a
          - backend-b
          - backend-c
          - unit
          - systems
          - districts
          - research-training-voice
          - frontend-core
          - integration

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov pytest-timeout
          pip install loguru fastapi uvicorn pydantic pydantic-settings python-dotenv httpx requests slowapi
          pip install anthropic openai gitpython apscheduler keyring watchdog
          pip install numpy pandas scipy scikit-learn beautifulsoup4 pyyaml networkx psutil jinja2 cryptography

      - name: Run pytest shard
        run: python scripts/run_pytest_shards.py --shard ${{ matrix.shard }} -- --timeout=60

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check vectorcode/python/vectorcode/ --ignore E501,F401,F811

  worker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: api/package-lock.json
      - name: Install Worker test dependencies
        run: npm ci
        working-directory: api
      - name: Run Worker smoke tests
        run: npm test
        working-directory: api
