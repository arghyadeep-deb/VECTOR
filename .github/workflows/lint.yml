
name: Lint

on:
  push:
    branches: [main, dev]

jobs:
  ruff:
    name: Ruff Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff on core/ and agents/
        run: |
          ruff check core/ agents/ \
            --ignore E501,F401,F811 \
            --select E,W,F,I \
            --output-format=github
