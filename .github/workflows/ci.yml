name: VECTOR CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    name: Module Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install loguru pydantic python-dotenv httpx fastapi uvicorn slowapi
          pip install pytest pytest-asyncio pytest-timeout
          pip install gitpython apscheduler keyring watchdog
          pip install anthropic openai google-api-python-client google-auth
          pip install lightrag-hku mediapipe face-recognition || true

      - name: Syntax check all Python files
        run: |
          find core/ agents/ -name "*.py" | xargs python -m py_compile
          echo "✅ Syntax check passed"

      - name: Core module smoke tests
        run: |
          python core/city/agent_base.py
          python core/memory/episodic.py
          python core/loop/permission_gateway.py
          python core/loop/context_engine.py
          python core/brain/goal_system.py
          python core/loop/decision_engine.py
          python core/memory/policy.py
          python core/memory/reasoning_memory.py
          python core/city/agent_registry.py

      - name: Run pytest
        run: python -m pytest tests/ --ignore=tests/integration --tb=short -q --timeout=30

  coverage:
    name: Coverage Gate
    needs: [smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
      - name: Check coverage
        run: python scripts/check_coverage.py

  build-dashboard:
    name: Build Holographic HUD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: core/ui/dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: core/ui/dashboard
      - name: Build dashboard
        run: npm run build
        working-directory: core/ui/dashboard
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: core/ui/dashboard/dist/
