name: VECTOR CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    name: Module Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install loguru pydantic pydantic-settings python-dotenv httpx fastapi uvicorn slowapi
          pip install pytest pytest-asyncio pytest-timeout
          pip install gitpython apscheduler keyring watchdog
          pip install anthropic openai google-api-python-client google-auth
          pip install psutil pyyaml networkx cryptography jinja2 beautifulsoup4
          pip install numpy pandas scipy scikit-learn
          pip install lightrag-hku mediapipe face-recognition || true

      - name: Syntax check all Python files
        run: |
          python -m compileall -q core districts vectorcode scripts agents tests
          echo "✅ Syntax check passed"

      - name: Bug-class lint (gap 2 of the post-audit improvement plan)
        run: |
          python scripts/bug_class_lint.py --check --report core districts vectorcode/src run_vector.py
          echo "✅ Bug-class lint blocking tier passed (advisory findings are reported, not blocking)"

      - name: Core module smoke tests
        run: |
          python core/city/agent_base.py
          python core/memory/episodic.py
          python core/loop/permission_gateway.py
          python core/loop/context_engine.py
          python core/brain/goal_system.py
          python core/loop/decision_engine.py
          python core/memory/policy.py
          python core/memory/reasoning_memory.py
          python core/city/agent_registry.py

      - name: Run pytest
        # 2026-08-06: was running only 3 of 18 shards (backend-c, frontend-core,
        # systems) — left root-level tests, unit, districts, integration,
        # research/training/voice, and backend-a/b completely untested in CI.
        # Now runs all shards via the runner (each shard is already sized to
        # fit in a reasonable CI window; the runner handles basetemp isolation
        # and --maxfail=1 per shard).
        run: python scripts/run_pytest_shards.py --continue-on-fail -- --timeout=60

  coverage:
    name: Coverage Gate
    needs: [smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov pytest-timeout
          pip install loguru fastapi uvicorn pydantic pydantic-settings python-dotenv httpx requests slowapi
          pip install anthropic openai gitpython apscheduler keyring watchdog
          pip install numpy pandas scipy scikit-learn beautifulsoup4 pyyaml networkx psutil jinja2 cryptography
      - name: Check coverage
        run: python scripts/check_coverage.py

  build-dashboard:
    name: Build Holographic HUD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: core/ui/dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: core/ui/dashboard
      - name: Build dashboard
        run: npm run build
        working-directory: core/ui/dashboard
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: core/ui/dashboard/dist/
