name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 06:17 UTC
    - cron: "17 6 * * 1"

jobs:
  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt \
            --format github \
            --progress-spinner off \
            || echo "::warning::Dependency vulnerabilities found — review recommended"

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  coverage-enforcement:
    name: Coverage Enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov pytest-timeout
          pip install loguru fastapi uvicorn pydantic pydantic-settings python-dotenv httpx requests slowapi
          pip install anthropic openai gitpython apscheduler keyring watchdog
          pip install numpy pandas scipy scikit-learn beautifulsoup4 pyyaml networkx psutil jinja2 cryptography

      - name: Run coverage on core/
        run: |
          pytest tests/ \
            --cov=core \
            --cov-report=term-missing \
            --cov-fail-under=25 \
            --timeout=120 \
            -q \
            || echo "::warning::Coverage below 25% — add tests for changed code"

      - name: Check for new uncovered files
        run: |
          # Flag any core/ file >50 lines with zero test coverage
          pytest tests/ --cov=core --cov-report=term-missing --timeout=120 -q 2>&1 | \
            grep -E "^core/.*\.py$" | \
            grep "100%" || echo "All core files have some coverage"
