name = "vector-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
BRAIN_SERVER_URL = "https://vector-brain.fly.dev"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (set via: wrangler secret put VECTOR_API_KEY)
# VECTOR_API_KEY = "..."
