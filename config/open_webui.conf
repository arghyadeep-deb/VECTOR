# Open-WebUI — VECTOR configuration
# Copy/rename to .env when running open-webui:
#   cp config/open_webui.conf .env && open-webui serve
# Or pass directly:
#   env $(cat config/open_webui.conf | grep -v ^#) open-webui serve
#
# Install:  pip install open-webui
# Docker:   docker run -d -p 3000:8080 --env-file config/open_webui.conf ghcr.io/open-webui/open-webui:main

# ── Primary backend: VECTOR gateway (OpenAI-compatible at port 8642) ──────────
# VECTOR exposes configured cloud/local models via one endpoint.
# Start the VECTOR gateway first.
OPENAI_API_BASE_URL=http://127.0.0.1:8642/v1
OPENAI_API_KEY=vector-local

# ── Fallback: direct Ollama (when VECTOR gateway is down) ─────────────────────
OLLAMA_BASE_URL=http://127.0.0.1:11434

# ── UI settings ───────────────────────────────────────────────────────────────
WEBUI_NAME=VECTOR Chat
# Set this in your shell or copied .env file with a generated value.
# Example: python -c "import secrets; print(secrets.token_urlsafe(48))"
WEBUI_SECRET_KEY=
WEBUI_AUTH=False
DEFAULT_MODELS=vector-focus

# ── Privacy (RULE 5 — no telemetry) ──────────────────────────────────────────
SCARF_NO_ANALYTICS=true
DO_NOT_TRACK=true
ANONYMIZED_TELEMETRY=false

# ── Port ──────────────────────────────────────────────────────────────────────
OPEN_WEBUI_PORT=3000
