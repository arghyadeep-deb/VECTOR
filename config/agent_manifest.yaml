# VECTOR Agent Manifest — declarative registry of all 57+ district agents
# Format: each agent maps to a Python class via its fully-qualified import path.
# ManifestLoader in core/city/declarative_manifest.py reads this file.
version: "1.0"

districts:

  coding:
    - name: git_bot
      class: districts.coding.git_bot.GitBot
      model: vector-coder
      description: Git operations — commit, push, diff, PR management
      capabilities: [git, code_review, github]

    - name: code_reviewer
      class: districts.coding.code_reviewer.CodeReviewer
      model: vector-coder
      description: AST-based code review; circular imports, security patterns
      capabilities: [code_review, ast_analysis, security]

    - name: architect_bot
      class: districts.coding.architect_bot.ArchitectBot
      model: vector-coder
      description: System design, architecture decisions, dependency graphs
      capabilities: [architecture, design, diagrams]

    - name: bug_hunter
      class: districts.coding.bug_hunter.BugHunter
      model: vector-coder
      description: Root-cause bug analysis and systematic debugging
      capabilities: [debugging, root_cause, testing]

    - name: test_writer
      class: districts.coding.test_writer.TestWriter
      model: vector-coder
      description: TDD test generation for Python modules
      capabilities: [testing, pytest, tdd]

  research:
    - name: research_hub
      class: districts.research.research_hub.ResearchHub
      model: vector-reasoning
      description: Orchestrates multi-source research workflows
      capabilities: [research, synthesis, web_search]

    - name: reddit_miner
      class: districts.research.reddit_miner.RedditMiner
      model: vector-focus
      description: Reddit thread mining for signals and trends
      capabilities: [reddit, social, trends]

    - name: news_aggregator
      class: districts.research.news_aggregator.NewsAggregator
      model: vector-focus
      description: RSS + news API aggregation and summarisation
      capabilities: [news, rss, summarisation]

    - name: paper_reader
      class: districts.research.paper_reader.PaperReader
      model: vector-deep
      description: ArXiv paper reading and key-insight extraction
      capabilities: [arxiv, papers, research]

    - name: web_scout
      class: districts.research.web_scout.WebScout
      model: vector-focus
      description: DuckDuckGo search + scrape + summarise
      capabilities: [web_search, scraping, summarisation]

  governance:
    - name: llm_council
      class: districts.governance.llm_council.LLMCouncil
      model: vector-chairman
      description: 3-stage deliberative council for high-stakes decisions
      capabilities: [deliberation, voting, high_stakes]
      hp_gate: 700

  reflection:
    - name: daily_reviewer
      class: districts.reflection.daily_reviewer.DailyReviewer
      model: vector-reasoning
      description: 2AM daily review — what happened, what to improve
      capabilities: [reflection, review, obsidian]

    - name: journal_writer
      class: districts.reflection.journal_writer.JournalWriter
      model: vector-reasoning
      description: Daily journal entry writer → Obsidian vault
      capabilities: [journaling, obsidian, writing]

    - name: growth_analyst
      class: districts.reflection.growth_analyst.GrowthAnalyst
      model: vector-reasoning
      description: Long-term growth pattern analysis from journal history
      capabilities: [growth, patterns, analytics]

  finance:
    - name: expense_tracker
      class: districts.finance.expense_tracker.ExpenseTracker
      model: vector-focus
      description: Tracks and categorises expenses from UPI/SMS data
      capabilities: [finance, expenses, upi]

    - name: budget_analyst
      class: districts.finance.budget_analyst.BudgetAnalyst
      model: vector-reasoning
      description: Budget analysis, variance tracking, savings projections
      capabilities: [finance, budgeting, analytics]

    - name: upi_parser
      class: districts.finance.upi_parser.UPIParser
      model: vector-ambient
      description: Parses UPI transaction SMS messages via ADB
      capabilities: [upi, sms, parsing]

    - name: tax_calendar
      class: districts.finance.tax_calendar.TaxCalendar
      model: vector-focus
      description: Indian FY tax deadlines and reminder system
      capabilities: [tax, calendar, india]

  health:
    - name: fatigue_monitor
      class: districts.health.fatigue_monitor.FatigueMonitor
      model: vector-focus
      description: EAR-based eye fatigue scoring from camera feed
      capabilities: [health, camera, fatigue]

    - name: sleep_tracker
      class: districts.health.sleep_tracker.SleepTracker
