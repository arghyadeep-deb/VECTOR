# VECTOR Agent Manifest — declarative registry of all 57+ district agents
# Format: each agent maps to a Python class via its fully-qualified import path.
# ManifestLoader in core/city/declarative_manifest.py reads this file.
version: "1.0"

districts:

  # 2026-09-29 SELF_DEV_P10_SELF_DEV: isolated VECTOR-tooling inspectors.
  # These agents parse only caller-supplied artifacts in memory. They do not
  # import coding agents, write files, or receive capabilities from any other district.
  self_dev:
    - name: agent_creator
      class: districts.self_dev.self_dev_specialists.AgentCreator
      model: vector-focus
      description: Validates supplied VECTOR tooling-agent metadata and AgentBase source structure
      capabilities: [agent_creation_brief, agent_definition_check]

    - name: plugin_validator
      class: districts.self_dev.self_dev_specialists.PluginValidator
      model: vector-focus
      description: Parses supplied plugin manifests and validates package structure and declared permissions
      capabilities: [plugin_validation_brief, plugin_manifest_check]

    - name: skill_reviewer
      class: districts.self_dev.self_dev_specialists.SkillReviewer
      model: vector-focus
      description: Reviews supplied skill documents for required metadata, sections, and actionable steps
      capabilities: [skill_review_brief, skill_structure_check]

    - name: skill_analyzer
      class: districts.self_dev.self_dev_specialists.SkillAnalyzer
      model: vector-focus
      description: Analyzes supplied skill structure, resource references, and unresolved placeholders
      capabilities: [skill_analysis_brief, skill_analysis_check]

    - name: skill_comparator
      class: districts.self_dev.self_dev_specialists.SkillComparator
      model: vector-focus
      description: Computes deterministic skill-document diffs against explicit change expectations
      capabilities: [skill_comparison_brief, skill_comparison_check]

    - name: skill_grader
      class: districts.self_dev.self_dev_specialists.SkillGrader
      model: vector-focus
      description: Grades supplied skill text against explicit weighted caller-supplied criteria
      capabilities: [skill_grading_brief, skill_grade_check]

    - name: conversation_analyzer
      class: districts.self_dev.self_dev_specialists.ConversationAnalyzer
      model: vector-focus
      description: Validates supplied conversation-derived hook rules against structured transcript events
      capabilities: [hook_conversation_brief, hook_candidate_check]

  coding:
    # Task A.2 (2026-06-21): CodingSwarm self-loads + internally routes to 9
    # more specialist agents not otherwise reachable (codebase_onboarding_engineer,
    # code_conductor_agent, code_intel_agent, database_optimizer, frontend_developer,
    # gui_automation_agent, minimal_change_engineer, mlops_agent, rapid_prototyper —
    # see districts/coding/agent.py PYTHON_AGENTS). Same orchestrator pattern already
    # registered for ops_swarm/qa_swarm; registering only the front door is correct —
    # registering the sub-agents individually too would just create a second,
    # always-losing (lower HP, no declared capability) dispatch path for them.
    - name: coding_swarm
      class: districts.coding.agent.CodingSwarm
      model: vector-coder
      description: Orchestrator that auto-loads and routes across 9 additional coding specialists by task-type keyword match
      capabilities: [onboarding, code_conductor, code-intel, database-optimizer, db_optimize, frontend_developer, gui, minimal-change, mlops, rapid-prototype, rapid_prototype, research]

    # Cleanup batch (2026-06-22): fixed run()-branching for 3, registered
    # obra_code_reviewer as-is (PromptAgent subclass — AgentBase via
    # core.city.prompt_agent.PromptAgent; its real run() is a generic
    # single-purpose LLM-persona dispatcher, not the AgentBase fake stub —
    # "branching on type" doesn't apply the same way to single-job prompt agents).
    - name: fastapi_reviewer
      class: districts.coding.fastapi_reviewer.FastAPIReviewer
      model: vector-coder
      description: FastAPI-specific code review (async correctness, dependency injection, Pydantic schemas)
      capabilities: [review_fastapi, fastapi_review]

    - name: python_reviewer
      class: districts.coding.python_reviewer.PythonReviewer
      model: vector-coder
      description: General Python code review (PEP8, idioms, type hints)
      capabilities: [review_python, check_pep8, python_review]

    - name: security_reviewer
      class: districts.coding.security_reviewer.SecurityReviewer
      model: vector-coder
      description: Security-focused code review and vulnerability scanning
      capabilities: [review_security, scan_vulnerabilities, security_code_review]

    - name: obra_code_reviewer
      class: districts.coding.obra_code_reviewer.ObraCodeReviewer
      model: vector-coder
      description: Independent second-opinion code reviewer (fresh-eyes review style)
      capabilities: [obra_review]

    - name: git_bot
      class: districts.coding.git_bot.GitBot
      model: vector-coder
      description: Git operations — commit, push, diff, PR management
      capabilities: [git, code_review, github]

    - name: code_reviewer
      class: districts.coding.code_reviewer.CodeReviewer
      model: vector-coder
      description: AST-based code review; circular imports, security patterns
      capabilities: [code_review, ast_analysis, security]

    - name: architect_bot
      class: districts.coding.architect_bot.ArchitectBot
      model: vector-coder
      description: System design, architecture decisions, dependency graphs
      capabilities: [architecture, design, diagrams]

    - name: bug_hunter
      class: districts.coding.bug_hunter.BugHunter
      model: vector-coder
      description: Root-cause bug analysis and systematic debugging
      capabilities: [debugging, root_cause, testing]

    - name: test_writer
      class: districts.coding.test_writer.TestWriter
      model: vector-coder
      description: TDD test generation for Python modules
      capabilities: [testing, pytest, tdd]

    # Task A.2 (2026-06-21): manifest_gap.md "ready to register" batch.
    - name: addy_code_reviewer
      class: districts.coding.addy_code_reviewer.AddyCodeReviewer
      model: vector-coder
      description: Senior code review across 5 dimensions — correctness, readability, performance, security, maintainability
      capabilities: [deep_code_review]

    - name: code_explorer
