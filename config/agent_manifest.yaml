      capabilities: [review_comment_brief, review_comment_check]

    - name: type_design_analyzer
      class: districts.coding.coding_specialists.TypeDesignAnalyzer
      model: vector-coder
      description: Public API type-design brief plus Python AST symbol and annotation checks
