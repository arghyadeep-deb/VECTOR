    - name: exercise_logger
      class: districts.health.exercise_logger.ExerciseLogger
      model: vector-focus
      description: Exercise session logging and streak tracking
      # RR-3.7B (2026-09-16, VECTOR_TECHNICAL_KNOWLEDGE/
      # RR3_7B_STRUCTURED_ROUTER_AUTHORIZATION_REPORT.md): "log_exercise"
      # added. This manifest is the real, authoritative capabilities source
      # at bootstrap -- ManifestLoader.register_all() overwrites the
      # in-code self.capabilities set in exercise_logger.py's own __init__
      # (confirmed live: without this entry, Governor.dispatch()'s exact
      # `task_type in agent.capabilities` match failed and the health
      # district's HP-lottery picked FatigueMonitor instead of this agent
      # for the "log_exercise" action_type, even after DISTRICT_TASK_MAP
      # routing was fixed to the correct district).
      capabilities: [health, exercise, logging, log_exercise]

    # Cleanup batch (2026-06-22): already correctly wired — run() reads
    # flat sources/obsidian keys (not task["type"], since this is a
    # single-operation agent) and does real work. No code change needed.
    - name: biometrics_aggregator
