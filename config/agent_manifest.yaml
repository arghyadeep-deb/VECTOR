      description: Sleep duration inference and quality scoring
      capabilities: [health, sleep, biometrics]

    - name: exercise_logger
      class: districts.health.exercise_logger.ExerciseLogger
      model: vector-focus
      description: Exercise session logging and streak tracking
      capabilities: [health, exercise, logging]

  memory_curator:
