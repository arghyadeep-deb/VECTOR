  memory_curator:
    - name: consolidation_bot
      class: districts.memory_curator.consolidation_bot.ConsolidationBot
      model: vector-deep
      description: LightRAG knowledge consolidation from episodic memory
      # KNOWN_ISSUES #21/#23: save_note/overwrite_note_personal are real
      # task_types Governor routes here (classify_chat_intent picks them with
      # high confidence for "note this down"-style requests), but capabilities
      # here are theme words, not literal task_type strings — see governor.py's
      # Task A.3 note on that mismatch. Without an exact match, dispatch fell
      # to the HP-lottery and ran whichever agent won HP's UNRELATED default
      # action instead (confirmed live: silently ran consolidate_old_episodes()
      # and returned a bare episode count as the "answer"). ConsolidationBot
      # now has a real handler for both (see consolidation_bot.py's
      # _save_note()) — these two literal task_type strings make governor.py's
      # existing capability-match logic route to it deterministically instead
      # of by HP luck.
      # 2026-07-30 (KNOWN_ISSUES #6): entity_add/knowledge_add/relation_add/
      # knowledge_relate/knowledge_query are real task_types DISTRICT_TASK_MAP
      # routes here (a genuine knowledge-graph capability, distinct from
      # note-saving above) but nothing declared them as literal capabilities
      # either — same HP-lottery-fallback gap as the original #21 bug, now
      # closed the same way: ConsolidationBot._kg_write()/_kg_query() give
      # them a real handler, these strings make the match deterministic.
      # 2026-07-30 Phase 2: same gap for the literal remember/recall/
      # memory_store/memory_query task_types (DISTRICT_TASK_MAP also routes
      # these here) -- see _remember_fact()/_recall_query().
      capabilities: [memory, lightrag, consolidation, save_note, overwrite_note_personal, create_note, entity_add, knowledge_add, relation_add, knowledge_relate, knowledge_query, remember, recall, memory_store, memory_query]

    - name: pattern_finder
      class: districts.memory_curator.pattern_finder.PatternFinder
      model: vector-reasoning
      description: Cross-memory pattern detection and insight surfacing
      capabilities: [memory, patterns, insights]

    # Task A.2 (2026-06-21): manifest_gap.md "ready to register" batch.
    - name: context_compressor
      class: districts.memory_curator.context_compressor.ContextCompressor
      model: vector-focus
      description: Smart context window manager — compresses long conversation histories
      capabilities: [context_compression, window_management]

    # 2026-09-29 SELF_DEV_P8_MEMORY_FINANCE_OPS: 2 evidence-checked specialists
    # (districts/memory_curator/memory_curator_specialists.py). <x>_brief reports evidence
    # completeness; <x>_check recomputes deterministically (set/dict clustering, ast parse) --
    # no LLM call in either agent. zk-steward is NOT re-built here: it already has a real match,
    # ZKSteward (districts/personal_growth/zk_steward.py), registered under personal_growth, not
    # memory_curator as this spec's district map names.
    # DECIDED 2026-09-29 (follow-up pass, was NEEDS_HUMAN): kept in personal_growth, not moved.
    # ZKSteward is live, tested, manifest-registered, and works correctly where it is; moving a
    # long-established agent's district for purely taxonomic reasons (no functional bug) is a
    # real behavioral change (get_by_district() filters, manifest structure) for zero functional
    # gain -- unlike SlackArchaeologist's same-day relocation just above in chief_of_staff/,
    # which had no accumulated dependents yet. The spec's memory_curator grouping remains a
    # reasonable categorization; personal_growth (alongside behavioral_nudge_engine,
    # feedback_synthesizer) is an equally coherent one for a personal Zettelkasten tool. Revisit
    # only if a real functional reason to move it ever comes up.
    - name: identity_graph_operator
      class: districts.memory_curator.memory_curator_specialists.IdentityGraphOperator
      model: vector-focus
      description: Identity-graph dedup brief plus deterministic duplicate-cluster detection over supplied entity records
      capabilities: [identity_graph_brief, identity_dedup_check]

    - name: lsp_index_engineer
      class: districts.memory_curator.memory_curator_specialists.LSPIndexEngineer
      model: vector-focus
      description: LSP symbol-index brief plus ast-based symbol indexing and expected-symbol diff over supplied Python source
      capabilities: [lsp_index_brief, lsp_symbol_check]

