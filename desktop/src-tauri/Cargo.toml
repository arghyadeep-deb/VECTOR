[package]
name = "vector-desktop"
version = "1.0.0"
description = "VECTOR — local-first personal AI desktop shell"
authors = ["Arghyadeep Deb"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.77"

[lib]
name = "vector_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri        = { version = "2.0", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-http = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-os = "2.0"
tauri-plugin-process = "2.0"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
reqwest      = { version = "0.12", features = ["json", "rustls-tls"] }
tokio        = { version = "1", features = ["full"] }
log          = "0.4"
env_logger   = "0.11"

[features]
# By default, the Tauri runtime auto-picks the platform-native window backend.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
